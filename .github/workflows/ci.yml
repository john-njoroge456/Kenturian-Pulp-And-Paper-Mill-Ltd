name: CI

on:
  push:
    branches: [main, deployment-prep]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DEBUG: "False"
      SECRET_KEY: "ci-only-not-a-real-secret-0123456789abcdefghijklmnopqrstuvwxyz"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Static files collect
        run: python manage.py collectstatic --noinput

      - name: Production security check
        env:
          SECURE_SSL: "True"
        run: python manage.py check --deploy --fail-level ERROR

      - name: Tests
        run: python manage.py test
