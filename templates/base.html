{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kenturian Pulp & Paper Mill{% endblock %}</title>

  <!-- Bootstrap CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-..." crossorigin="anonymous">

  <style>
    /* Small custom tweaks */
    body { padding-top: 80px; }
    .site-logo { height: 60px; }
    .navbar-brand .brand-text { font-weight: 700; letter-spacing: .5px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="{% url 'main:index' %}">
        <img src="{% static LOGO_STATIC %}" alt="Kenturian logo" class="site-logo me-3" onerror="this.style.display='none'">
        <div class="d-none d-sm-block">
          <div class="brand-text">KENTURIAN PULP &amp; PAPER MILLS LIMITED</div>
          <small class="text-light">Proudly recycled • Nairobi, Kenya</small>
        </div>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'main:index' %}">Home</a></li>
          <!-- Add other nav links here -->
          <li class="nav-item"><a class="nav-link" href="/admin/">Admin</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    {% block content %}
    <!-- Page content -->
    {% endblock %}
  </main>

  <footer class="bg-light border-top mt-auto py-3">
    <div class="container text-muted small">
      &copy; {{ now|date:"Y" }} Kenturian Pulp & Paper Mills Limited — Contact: {{ COMPANY_EMAIL }}
    </div>
  </footer>

  <!-- Bootstrap JS bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-..." crossorigin="anonymous"></script>
</body>
</html>
