<svg width="1600" height="420" viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1a30"/>
      <stop offset="45%" stop-color="#12274a"/>
      <stop offset="100%" stop-color="#1c3c66"/>
    </linearGradient>
    <radialGradient id="glowWhite" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dfe9ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#dfe9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a7ba8"/>
      <stop offset="100%" stop-color="#324f74"/>
    </linearGradient>
    <linearGradient id="tileMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33507a"/>
      <stop offset="100%" stop-color="#1d3454"/>
    </linearGradient>
    <linearGradient id="tileDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c3252"/>
      <stop offset="100%" stop-color="#0e1c33"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>

  <!-- soft readability glow behind where the title/subtitle sits -->
  <circle cx="260" cy="230" r="340" fill="url(#glowWhite)"/>

  <!-- very faint diagonal light sweep, subtle, confined to the right side -->
  <g transform="rotate(-12 1050 210)" opacity="0.5">
    <rect x="500" y="60" width="1300" height="90" fill="#7fa8e0" opacity="0.10"/>
  </g>

  <!-- ============ TILE MOSAIC — right ~58% of frame, loose grid with gaps ============ -->
  <!-- helper: each tile = bezel rect + inner icon, monochrome blue only -->

  <!-- Row 1 -->
  <g transform="translate(700,30)" filter="url(#shadow)">
    <rect width="110" height="110" rx="6" fill="url(#tileMid)"/>
    <g transform="translate(55,55)" fill="none" stroke="#c9d9f2" stroke-width="4" stroke-linecap="round">
      <path d="M -28,-9 A 30 30 0 0 1 13,-28"/>
      <path d="M 28,9 A 30 30 0 0 1 -13,28"/>
      <path d="M -30,-14 -28,-28 -15,-22"/>
      <path d="M 30,14 28,28 15,22"/>
    </g>
    <rect width="110" height="110" rx="6" fill="url(#sheen)"/>
  </g>

  <g transform="translate(828,10)" filter="url(#shadow)">
    <rect width="130" height="130" rx="6" fill="url(#tileLight)"/>
    <ellipse cx="65" cy="65" rx="32" ry="46" fill="none" stroke="#eef3fb" stroke-opacity="0.9" stroke-width="4"/>
    <ellipse cx="65" cy="65" rx="13" ry="19" fill="none" stroke="#c9d9f2" stroke-width="3"/>
    <rect width="130" height="130" rx="6" fill="url(#sheen)"/>
  </g>

  <g transform="translate(976,25)" filter="url(#shadow)">
    <rect width="105" height="105" rx="6" fill="url(#tileDark)"/>
    <g transform="translate(52,52)" fill="none" stroke="#9fb8de" stroke-width="2.5">
      <circle r="32"/>
      <ellipse rx="32" ry="12"/>
      <ellipse rx="32" ry="22"/>
    </g>
    <rect width="105" height="105" rx="6" fill="url(#sheen)"/>
  </g>

  <g transform="translate(1099,5)" filter="url(#shadow)">
    <rect width="120" height="120" rx="6" fill="url(#tileMid)"/>
    <g transform="translate(24,25)" stroke="#c9d9f2" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="60" x2="0" y2="34"/>
      <line x1="20" y1="60" x2="20" y2="12"/>
      <line x1="40" y1="60" x2="40" y2="42"/>
      <line x1="60" y1="60" x2="60" y2="0"/>
    </g>
    <rect width="120" height="120" rx="6" fill="url(#sheen)"/>
  </g>

  <g transform="translate(1237,20)" filter="url(#shadow)">
    <rect width="100" height="100" rx="6" fill="url(#tileLight)"/>
    <path d="M50,20 C75,26 78,55 55,75 C40,60 30,38 50,20 Z" fill="#eef3fb" fill-opacity="0.85"/>
    <rect width="100" height="100" rx="6" fill="url(#sheen)"/>
  </g>

  <g transform="translate(1355,35)" filter="url(#shadow)">
    <rect width="90" height="90" rx="6" fill="url(#tileDark)"/>
    <g transform="translate(20,20)" stroke="#c9d9f2" stroke-width="3.5" stroke-linecap="round">
      <line x1="0" y1="0" x2="48" y2="0"/>
      <line x1="0" y1="16" x2="48" y2="16"/>
      <line x1="0" y1="32" x2="32" y2="32"/>
    </g>
    <rect width="90" height="90" rx="6" fill="url(#sheen)"/>
  </g>

  <!-- Row 2, staggered lower with visible gaps -->
  <g transform="translate(720,165)" filter="url(#shadow)">
    <rect width="95" height="95" rx="6" fill="url(#tileDark)"/>
    <g transform="translate(48,48)" fill="none" stroke="#9fb8de" stroke-width="3.5">
      <circle r="16"/>
      <circle r="6" fill="#9fb8de" stroke="none"/>
      <g stroke-linecap="round">
        <line x1="0" y1="-21" x2="0" y2="-16"/>
        <line x1="0" y1="21" x2="0" y2="16"/>
        <line x1="-21" y1="0" x2="-16" y2="0"/>
        <line x1="21" y1="0" x2="16" y2="0"/>
      </g>
    </g>
    <rect width="95" height="95" rx="6" fill="url(#sheen)"/>
  </g>

  <!-- Large emphasis tile: hand reaching toward a touchscreen, echoing kenafric's focal tile -->
  <g transform="translate(845,145)" filter="url(#shadow)">
    <rect width="150" height="150" rx="8" fill="url(#tileLight)"/>
    <circle cx="75" cy="75" r="34" fill="none" stroke="#eef3fb" stroke-opacity="0.5" stroke-width="2"/>
    <g transform="translate(30,95)" fill="#0e1c33">
      <path d="M0,55 C-2,30 4,15 16,5 C22,0 24,8 22,14 C30,10 36,16 33,24 C42,24 46,34 40,42 C46,46 46,55 40,55 Z"/>
    </g>
    <circle cx="75" cy="60" r="3" fill="#eef3fb"/>
    <rect width="150" height="150" rx="8" fill="url(#sheen)"/>
  </g>

  <g transform="translate(1015,180)" filter="url(#shadow)">
    <rect width="105" height="105" rx="6" fill="url(#tileMid)"/>
    <g transform="translate(24,26)" fill="none" stroke="#c9d9f2" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="55"/>
      <line x1="0" y1="55" x2="55" y2="55"/>
      <polyline points="8,40 25,22 38,32 55,10" fill="none"/>
    </g>
    <rect width="105" height="105" rx="6" fill="url(#sheen)"/>
  </g>

  <g transform="translate(1140,160)" filter="url(#shadow)">
    <rect width="130" height="130" rx="6" fill="url(#tileDark)"/>
    <g transform="translate(65,65)" fill="none" stroke="#9fb8de" stroke-width="2.5">
      <circle r="38"/>
      <ellipse rx="38" ry="14"/>
      <ellipse rx="38" ry="26"/>
      <line x1="-38" y1="0" x2="38" y2="0"/>
    </g>
    <circle cx="48" cy="48" r="2.5" fill="#eef3fb"/>
    <rect width="130" height="130" rx="6" fill="url(#sheen)"/>
  </g>

  <g transform="translate(1290,175)" filter="url(#shadow)">
    <rect width="100" height="100" rx="6" fill="url(#tileLight)"/>
    <g transform="translate(20,55)" stroke="#eef3fb" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="0" x2="14" y2="-18"/>
      <line x1="14" y1="-18" x2="28" y2="-6"/>
      <line x1="28" y1="-6" x2="55" y2="-35"/>
    </g>
    <rect width="100" height="100" rx="6" fill="url(#sheen)"/>
  </g>

  <!-- Row 3, small scattered accents -->
  <g transform="translate(760,290)" filter="url(#shadow)">
    <rect width="70" height="70" rx="5" fill="url(#tileMid)"/>
    <circle cx="35" cy="35" r="14" fill="none" stroke="#c9d9f2" stroke-width="3.5"/>
    <rect width="70" height="70" rx="5" fill="url(#sheen)"/>
  </g>
  <g transform="translate(860,310)" filter="url(#shadow)">
    <rect width="60" height="60" rx="5" fill="url(#tileDark)"/>
    <path d="M12,45 22,25 32,38 45,12" fill="none" stroke="#9fb8de" stroke-width="3.5" stroke-linecap="round"/>
    <rect width="60" height="60" rx="5" fill="url(#sheen)"/>
  </g>
  <g transform="translate(1000,300)" filter="url(#shadow)">
    <rect width="80" height="80" rx="5" fill="url(#tileLight)"/>
    <g transform="translate(40,40)" fill="none" stroke="#eef3fb" stroke-width="3">
      <circle r="16"/>
      <circle r="6" fill="#eef3fb" stroke="none"/>
    </g>
    <rect width="80" height="80" rx="5" fill="url(#sheen)"/>
  </g>
  <g transform="translate(1160,310)" filter="url(#shadow)">
    <rect width="65" height="65" rx="5" fill="url(#tileDark)"/>
    <g transform="translate(14,16)" stroke="#c9d9f2" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="0" x2="36" y2="0"/>
      <line x1="0" y1="12" x2="36" y2="12"/>
      <line x1="0" y1="24" x2="24" y2="24"/>
    </g>
    <rect width="65" height="65" rx="5" fill="url(#sheen)"/>
  </g>
  <g transform="translate(1300,295)" filter="url(#shadow)">
    <rect width="75" height="75" rx="5" fill="url(#tileMid)"/>
    <path d="M38,15 C58,20 60,42 40,58 C28,46 20,28 38,15 Z" fill="#c9d9f2" fill-opacity="0.85"/>
    <rect width="75" height="75" rx="5" fill="url(#sheen)"/>
  </g>
  <g transform="translate(1420,270)" filter="url(#shadow)">
    <rect width="70" height="70" rx="5" fill="url(#tileDark)"/>
    <g transform="translate(35,35)" fill="none" stroke="#9fb8de" stroke-width="2">
      <circle r="24"/>
      <ellipse rx="24" ry="9"/>
    </g>
    <rect width="70" height="70" rx="5" fill="url(#sheen)"/>
  </g>

  <!-- sparse particle field, subtle, cool tones only -->
  <g fill="#c9d9f2" fill-opacity="0.4">
    <circle cx="770" cy="130" r="2"/>
    <circle cx="990" cy="150" r="1.8"/>
    <circle cx="1230" cy="120" r="2"/>
    <circle cx="1080" cy="260" r="1.8"/>
    <circle cx="1350" cy="140" r="2"/>
    <circle cx="1450" cy="200" r="1.8"/>
  </g>

  <!-- left side kept clean and dark for headline text -->
  <rect x="0" y="0" width="680" height="420" fill="#0a1a30" fill-opacity="0.4"/>
</svg>
